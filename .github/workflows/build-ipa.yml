name: Build ZetaStitch IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run XCTest suite on iOS Simulator"
        required: false
        default: true
        type: boolean

jobs:
  build-ios:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode and ensure Metal Toolchain
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          if ! xcrun metal --version >/dev/null 2>&1; then
            echo "Downloading MetalToolchain for Xcode 26+..."
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests on iOS Simulator
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          set -o pipefail
          mkdir -p build/logs
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((dev['udid'] for rt,devs in sorted(d.get('devices',{}).items(), reverse=True) if 'iOS' in rt for dev in devs if dev.get('isAvailable') and 'iPhone' in dev.get('name','')), ''))")
          echo "Using Simulator UDID: $SIM_UDID"
          test -n "$SIM_UDID"
          set +e
          xcodebuild test \
            -project ZetaStitch.xcodeproj \
            -scheme ZetaStitch \
            -destination "id=$SIM_UDID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" 2>&1 | tee build/logs/test.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            grep -E "ld:|Undefined|symbol\(s\) not found|not found for|framework.*not found|library.*not found|error:|fatal error:|Testing failed:|TEST FAILED|BUILD FAILED|requires a development team" build/logs/test.log | head -n 40 | while IFS= read -r line; do
              echo "::error::[test] $line"
            done
            tail -n 30 build/logs/test.log | while IFS= read -r line; do
              echo "::warning::[test-tail] $line"
            done
            exit "$STATUS"
          fi

      - name: Build unsigned IPA (for TrollStore / Esign / Sideloadly)
        run: |
          set -o pipefail
          mkdir -p build/logs
          set +e
          xcodebuild build \
            -project ZetaStitch.xcodeproj \
            -scheme ZetaStitch \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build/logs/build-unsigned.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            grep -E "ld:|Undefined|symbol\(s\) not found|not found for|framework.*not found|library.*not found|error:|fatal error:|BUILD FAILED" build/logs/build-unsigned.log | head -n 40 | while IFS= read -r line; do
              echo "::error::[build] $line"
            done
            exit "$STATUS"
          fi

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ZetaStitch.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/ZetaStitch"
          test -f "$APP_PATH/PlugIns/ZetaScrollshotExtension.appex/ZetaScrollshotExtension"
          test -f "$APP_PATH/default.metallib"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry ../ZetaStitch-unsigned.ipa Payload)
          ls -lh build/ZetaStitch-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZetaStitch-unsigned-ipa
          path: build/ZetaStitch-unsigned.ipa

      - name: Check signing secrets availability
        id: signing_check
        env:
          HAS_P12: ${{ secrets.APPLE_P12_BASE64 != '' }}
          HAS_APP_PROF: ${{ secrets.APP_PROVISION_BASE64 != '' }}
          HAS_EXT_PROF: ${{ secrets.EXT_PROVISION_BASE64 != '' }}
        run: |
          if [ "$HAS_P12" = "true" ] && [ "$HAS_APP_PROF" = "true" ] && [ "$HAS_EXT_PROF" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed IPA (when Apple signing secrets are configured)
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APP_PROVISION_BASE64: ${{ secrets.APP_PROVISION_BASE64 }}
          EXT_PROVISION_BASE64: ${{ secrets.EXT_PROVISION_BASE64 }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD || 'ad-hoc' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="temp_ci_keychain_pass"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "$APPLE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APP_PROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$EXT_PROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/ext.mobileprovision"

          parse_profile() {
            security cms -D -i "$1" > "$RUNNER_TEMP/profile.plist"
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
            TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
            APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
            BUNDLE_ID="${APPID#*.}"
            cp "$1" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
            echo "$UUID|$NAME|$TEAM|$BUNDLE_ID"
          }

          IFS='|' read -r APP_UUID APP_PROF_NAME TEAM_ID APP_BUNDLE_ID <<< "$(parse_profile "$RUNNER_TEMP/app.mobileprovision")"
          IFS='|' read -r EXT_UUID EXT_PROF_NAME _ EXT_BUNDLE_ID <<< "$(parse_profile "$RUNNER_TEMP/ext.mobileprovision")"

          xcodebuild archive \
            -project ZetaStitch.xcodeproj \
            -scheme ZetaStitch \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ZetaStitch.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            APP_BUNDLE_ID="$APP_BUNDLE_ID" \
            APP_PROVISION_PROFILE="$APP_PROF_NAME" \
            EXT_BUNDLE_ID="$EXT_BUNDLE_ID" \
            EXT_PROVISION_PROFILE="$EXT_PROF_NAME"

          APP_BUNDLE_ID="$APP_BUNDLE_ID" \
          APP_PROF_NAME="$APP_PROF_NAME" \
          EXT_BUNDLE_ID="$EXT_BUNDLE_ID" \
          EXT_PROF_NAME="$EXT_PROF_NAME" \
          TEAM_ID="$TEAM_ID" \
          python3 -c "import plistlib, os; plistlib.dump({'method': os.environ['EXPORT_METHOD'], 'signingStyle': 'manual', 'teamID': os.environ['TEAM_ID'], 'provisioningProfiles': {os.environ['APP_BUNDLE_ID']: os.environ['APP_PROF_NAME'], os.environ['EXT_BUNDLE_ID']: os.environ['EXT_PROF_NAME']}}, open(os.environ['RUNNER_TEMP'] + '/ExportOptions.plist', 'wb'))"

          xcodebuild -exportArchive \
            -archivePath build/ZetaStitch.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/signed_export

          mv build/signed_export/*.ipa build/ZetaStitch-signed.ipa

      - name: Upload signed IPA artifact
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZetaStitch-signed-ipa
          path: build/ZetaStitch-signed.ipa

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/logs/
